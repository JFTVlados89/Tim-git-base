syntax = "proto3";

package homework.v1;

service FacilityService {
  
  rpc GetFacility (GetFacilityRequest) returns (Facility);
  
  rpc ListFacilities (ListFacilitiesRequest) returns (stream Facility);
  
  rpc CreateFacilities (stream Facility) returns (CreateFacilitiesSummary);
  
  rpc ProcessFacilities (stream Facility) returns (stream Facility);
}

message Facility {
  int32 facility_id = 1; 
  string name = 2;
  string type = 3;
  int32 price = 4;
}

message GetFacilityRequest {
  int32 facility_id = 1;
}

message ListFacilitiesRequest {
  uint32 limit = 1;
}


message CreateFacilitiesSummary {
  uint32 created_count = 1;
}